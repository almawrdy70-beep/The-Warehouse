<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Auto Parts Smart Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f15; --bg2:#10161f; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#e9eef6; --muted:#8c99ad; --dim:#5f6b7e;
  --amber:#ffb224; --amber-soft:rgba(255,178,36,.14); --amber-line:rgba(255,178,36,.5);
  --teal:#2dd4bf; --teal-soft:rgba(45,212,191,.13);
  --ok:#3ddc97; --danger:#ff6b6b; --warn:#ffcf5c;
  --r:14px; --r-sm:9px;
  --sans:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
  --side:244px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;font-size:15px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 85% -10%,rgba(255,178,36,.10),transparent 60%),radial-gradient(700px 500px at -5% 105%,rgba(45,212,191,.09),transparent 60%),
  linear-gradient(var(--bg),var(--bg2))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:right}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
mark{background:rgba(255,178,36,.32);color:#fff;border-radius:3px;padding:0 1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px;border:2px solid transparent;background-clip:padding-box}

/* layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-inline-end:1px solid var(--line);background:rgba(8,11,16,.6);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--amber),#ff7a1a);color:#1a1100;box-shadow:0 6px 22px rgba(255,150,30,.35)}
.logo .ic{width:22px;height:22px;stroke-width:2.2}
.brand b{display:block;font-size:15px;line-height:1.2;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11.5px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .2s,color .2s;position:relative}
.nav a:hover{background:var(--panel);color:var(--text)}
.nav a.on{background:var(--amber-soft);color:var(--amber)}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--amber)}
.nav .ic{width:20px;height:20px}
.side .grow{flex:1}
.dbcard{margin:8px 4px 0;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.dbcard b{display:block;color:var(--text);font-size:18px;font-family:var(--mono);font-weight:700}
.main{min-width:0;padding:26px clamp(16px,3vw,40px) 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar h2{font-size:20px;font-weight:700}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:500;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1);border-color:var(--line2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(145deg,var(--amber),#ff8a1f);color:#1a1100;border-color:transparent;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:9px}
.btn[disabled]{opacity:.4;pointer-events:none}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px)}

.view{display:none}
.view.on{display:block;animation:viewin .35s ease both}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* search */
.hero{max-width:880px;margin:10px auto 22px;text-align:center}
.hero h1{font-size:clamp(24px,4vw,36px);font-weight:700;line-height:1.3;margin-bottom:6px}
.hero p{color:var(--muted);margin-bottom:22px}
.searchbox{display:flex;align-items:center;gap:12px;padding:0 18px;height:68px;border-radius:18px;border:1.5px solid var(--line2);background:rgba(255,255,255,.06);transition:border-color .2s,box-shadow .25s}
.searchbox:focus-within{border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft),0 16px 50px rgba(0,0,0,.4)}
.searchbox .ic{width:26px;height:26px;color:var(--amber)}
.searchbox input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:22px;height:100%;font-family:var(--mono);font-weight:500}
.searchbox input::placeholder{font-family:var(--sans);color:var(--dim);font-weight:400;font-size:18px}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13.5px;transition:.2s}
.chip:hover{color:var(--text);border-color:var(--line2)}
.chip.on{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber);font-weight:600}
.tryrow{margin-top:14px;color:var(--dim);font-size:13px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.try{font-family:var(--mono);font-size:13px;padding:3px 10px;border-radius:7px;background:var(--panel);border:1px dashed var(--line2);color:var(--muted)}
.try:hover{color:var(--amber);border-color:var(--amber-line)}
.rmeta{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 14px;color:var(--muted);font-size:13.5px;min-height:24px;flex-wrap:wrap;gap:8px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:11px;background:var(--teal-soft);border:1px solid rgba(45,212,191,.35);color:#bff5ec;margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--amber-soft);border-color:var(--amber-line);color:#ffe2a8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.03));border:1px solid var(--line);backdrop-filter:blur(12px);transition:border-color .2s,transform .2s,box-shadow .2s;animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*45ms);cursor:pointer}
.cards.noanim .card{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.codepill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:15px;padding:4px 6px 4px 11px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.cp{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;color:var(--muted);transition:.15s}
.cp:hover{background:rgba(255,255,255,.12);color:var(--text)}
.cp.done{color:var(--ok)}
.qty{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(61,220,151,.13);color:var(--ok)}
.qty.zero{background:rgba(255,107,107,.14);color:var(--danger)}
.qty.low{background:rgba(255,207,92,.15);color:var(--warn)}
.qty i{width:7px;height:7px;border-radius:50%;background:currentColor}
.c-name{font-size:16.5px;font-weight:600;line-height:1.5;word-break:break-word}
.c-title{display:inline-flex;gap:6px;align-items:center;color:var(--teal);font-size:13px;background:var(--teal-soft);padding:2px 10px;border-radius:99px;width:fit-content;max-width:100%}
.pns{display:flex;flex-wrap:wrap;gap:7px}
.pn{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:8px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:13px}
.pn small{color:var(--dim);font-size:11px}
.pn .mono{font-weight:700}
.nopn{color:var(--dim);font-size:13px}
.loc{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:linear-gradient(135deg,rgba(255,178,36,.2),rgba(255,178,36,.06));border:1.5px solid var(--amber-line);position:relative;overflow:hidden}
.loc::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:rgba(255,178,36,.12)}
.loc .pin{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--amber);color:#1a1100;flex:none}
.loc .pin .ic{width:21px;height:21px;stroke-width:2.2}
.loc small{display:block;color:#ffd48a;font-size:11.5px;line-height:1.2}
.loc .lv{font-family:var(--mono);font-weight:700;font-size:21px;color:var(--amber);letter-spacing:.3px;line-height:1.3;word-break:break-all}
.loc .cp{margin-inline-start:auto;position:relative;z-index:1;color:#ffd48a}
.loc.none{background:rgba(255,255,255,.03);border:1.5px dashed var(--line2)}
.loc.none .pin{background:rgba(255,255,255,.08);color:var(--muted)}
.loc.none .lv{color:var(--muted);font-family:var(--sans);font-size:15px;font-weight:500}
.loc.none::after{display:none}
.meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meta3 div{padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.035);min-width:0}
.meta3 small{display:block;color:var(--dim);font-size:11.5px}
.meta3 span{display:block;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);margin-top:auto}
.qbig{font-family:var(--mono);font-weight:700;font-size:22px}
.qbig small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.price{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:700;color:#e8f0ff;cursor:pointer;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.05)}
.price .pv{filter:blur(6px);transition:filter .2s;user-select:none}
.price.show .pv,body.prices .price .pv{filter:none;user-select:auto}
.price small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:11.5px}
.more{display:flex;justify-content:center;margin:22px 0}
.empty{text-align:center;padding:50px 20px;color:var(--muted);max-width:520px;margin:20px auto}
.empty .big{width:72px;height:72px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;background:var(--panel2);color:var(--amber)}
.empty .big .ic{width:34px;height:34px}
.empty h3{color:var(--text);font-size:19px;margin-bottom:6px}
.empty .btn{margin-top:18px}

/* bulk search */
.bulk-grid{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.bulk-box{padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
.bulk-box h3{font-size:16px;display:flex;align-items:center;gap:8px}
.bulk-box textarea{width:100%;min-height:260px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.28);border:1.5px solid var(--line2);font-family:var(--mono);font-size:14.5px;line-height:1.8;resize:vertical;outline:0;direction:ltr;text-align:left}
.bulk-box textarea:focus{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.bulk-box textarea::placeholder{font-family:var(--sans);direction:rtl;text-align:right;color:var(--dim)}
.bulk-acts{display:flex;gap:8px;flex-wrap:wrap}
.bulk-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;justify-content:space-between}
.bulk-badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.badge.ok{background:rgba(61,220,151,.13);color:var(--ok);border-color:rgba(61,220,151,.3)}
.badge.miss{background:rgba(255,107,107,.13);color:var(--danger);border-color:rgba(255,107,107,.3)}
.badge.dup{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.bulk-miss{background:rgba(255,107,107,.06)!important}
.bulk-miss:hover{background:rgba(255,107,107,.11)!important}
.pn-stack{display:flex;flex-wrap:wrap;gap:5px}
.pn-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-family:var(--mono);font-size:12.5px}

/* table */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tsearch{flex:1 1 260px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:0}
.tsearch:focus-within{border-color:var(--amber)}
.tsearch input{flex:1;min-width:0;background:none;border:0;outline:0}
.pop{position:relative}
.combo-btn{display:flex;align-items:center;gap:8px;height:44px;padding:0 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:130px;justify-content:space-between;transition:.2s}
.combo-btn:hover{border-color:var(--line2)}
.combo-btn.set{border-color:var(--amber-line);background:var(--amber-soft)}
.combo-btn small{color:var(--muted);font-size:12px;display:block;line-height:1}
.combo-btn span{display:block;font-size:13.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popbox{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:40;width:290px;max-width:90vw;max-height:380px;display:none;flex-direction:column;background:#141b26;border:1px solid var(--line2);border-radius:13px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
.pop.open .popbox{display:flex;animation:viewin .18s ease both}
.popbox .ps{padding:8px;border-bottom:1px solid var(--line)}
.popbox .ps input{width:100%;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);outline:0}
.popbox ul{list-style:none;overflow:auto;padding:5px}
.popbox li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.popbox li:hover,.popbox li.on{background:rgba(255,255,255,.08)}
.popbox li.on{color:var(--amber)}
.popbox li em{font-style:normal;color:var(--dim);font-family:var(--mono);font-size:12px}
.popbox li.pre{color:var(--teal)}
.colrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13.5px}
.colrow:hover{background:rgba(255,255,255,.06)}
.colrow.drag{opacity:.4}
.colrow label{flex:1;display:flex;gap:8px;align-items:center;cursor:pointer;min-width:0}
.colrow label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colrow .grip{cursor:grab;color:var(--dim)}
input[type=checkbox]{accent-color:var(--amber);width:16px;height:16px}
.popfoot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.tinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 10px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.tinfo b{color:var(--text);font-family:var(--mono)}
.afilters{display:flex;gap:6px;flex-wrap:wrap}
.afilters .chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.twrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:rgba(10,14,20,.6);max-height:calc(100vh - 290px);min-height:200px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
thead th{position:sticky;top:0;z-index:2;background:#151c28;text-align:start;padding:11px 14px;font-weight:600;color:#c6d0df;white-space:nowrap;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none}
thead th:hover{color:var(--amber)}
thead th .ic{width:14px;height:14px;margin-inline-start:6px;vertical-align:-2px;color:var(--amber)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(255,178,36,.06)}
td.num{font-family:var(--mono)}
.locpill{font-family:var(--mono);font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:1px 9px;border-radius:7px;font-size:12.5px}
.nul{color:var(--dim)}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;padding:0 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.pager button:hover{border-color:var(--line2)}
.pager button.on{background:var(--amber);color:#1a1100;border-color:transparent;font-weight:700}
.pager button[disabled]{opacity:.35;pointer-events:none}
.pager select{height:36px;padding:0 8px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin-inline-start:10px}
.pager select option{background:#141b26}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.tile{padding:16px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;text-align:start;transition:.2s}
button.tile:hover{border-color:var(--amber-line);transform:translateY(-2px)}
.tile .tl{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13.5px}
.tile .tl .ic{width:18px;height:18px;color:var(--amber)}
.tile .tv{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.1}
.tile .tv small{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--sans)}
.tile .tn{font-size:12.5px;color:var(--dim)}
.tile.warnt .tv{color:var(--warn)}
.tile.date .tv{font-size:19px;font-family:var(--sans);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.panel{padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.panel h3{font-size:15.5px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;font-size:13.5px;width:100%;text-align:start;border-radius:8px;padding:2px 4px}
.bar:hover{background:rgba(255,255,255,.05)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .fl{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--amber),#ff8a1f);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bars.teal .fl{background:linear-gradient(90deg,var(--teal),#38bdf8)}
.bar em{font-style:normal;font-family:var(--mono);color:var(--muted);text-align:end}

/* data page */
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:38px 20px;border:2px dashed var(--line2);border-radius:20px;background:var(--panel);transition:.25s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--amber);background:var(--amber-soft)}
.drop .big{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber)}
.drop .big .ic{width:30px;height:30px}
.drop h3{font-size:18px}
.dgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cols{max-height:420px;overflow:auto;border-radius:10px;border:1px solid var(--line)}
.cols table td,.cols table th{padding:7px 12px}
.cols thead th{cursor:default;position:sticky}
.role{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.role.loc{background:var(--amber-soft);color:var(--amber);display:inline-block;border:0;padding:1px 9px;overflow:visible}
.role.loc::after{display:none}
.role.x{background:rgba(255,255,255,.06);color:var(--muted)}

/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(3,5,9,.6);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(480px,100vw);z-index:70;background:#101722;border-inline-end:1px solid var(--line2);transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:30px 0 80px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.dh h3{font-size:17px;line-height:1.5}
.db{overflow:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:16px}
.sec h4{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row span:first-child{color:var(--muted);flex-shrink:0;white-space:nowrap}
.row span:last-child{display:flex;align-items:center;justify-content:flex-end;gap:6px;text-align:end;word-break:normal;overflow-wrap:break-word}
.row span:last-child .mono{white-space:nowrap}
.same{display:flex;flex-direction:column;gap:6px}
.same button{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:start;font-size:13.5px}
.same button:hover{border-color:var(--amber-line)}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(3,5,9,.65);backdrop-filter:blur(4px);animation:fadein .2s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.mbox{width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;background:#111823;border:1px solid var(--line2);border-radius:18px;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.2,.9,.3,1.2) both}
.mbox.wide{width:min(780px,100%)}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.mh{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:18px}
.mb{padding:6px 20px 14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:11px 13px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:22px}
.stat small{color:var(--muted)}
.stat.good b{color:var(--ok)}.stat.warnx b{color:var(--warn)}
.wlist{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.wlist li{display:flex;gap:8px;padding:8px 11px;border-radius:9px;background:var(--amber-soft);color:#ffe2a8}
.wlist li.ok{background:rgba(61,220,151,.1);color:#b9f3d8}
.maprow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:14px}
.maprow select{width:100%;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);outline:0}
.maprow select option{background:#141b26}
.maprow.miss select{border-color:var(--amber)}
.toasts{position:fixed;bottom:22px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;padding:0 14px}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;background:#1a2331;border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .25s both;max-width:min(520px,100%);font-size:14px}
.toast.ok .ic{color:var(--ok)}.toast.err .ic{color:var(--danger)}.toast.err{border-color:rgba(255,107,107,.5)}
.busy{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(3,5,9,.7);backdrop-filter:blur(4px)}
.busy div{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 34px;border-radius:18px;background:#121a26;border:1px solid var(--line2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--amber);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dropall{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(255,178,36,.12);backdrop-filter:blur(5px);border:4px dashed var(--amber);font-size:24px;font-weight:700;color:var(--amber)}
.dropall.on{display:grid}
.warnbar{margin-bottom:16px}

/* responsive */
@media (max-width:1100px){

  .brand,.side .grow{display:none}

  .maprow{grid-template-columns:1fr}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
(() => {
const DEFAULT_EXCEL_FILES = ['data.xlsx', 'parts.xlsx', 'stock.xlsx', 'inventory.xlsx'];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = n => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const fmt = n => Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});
const isEmpty = v => v === null || v === undefined || (typeof v === 'string' && v.trim() === '');
const show = v => v instanceof Date ? v.toISOString().slice(0, 10) : (isEmpty(v) ? '' : String(v).trim());
const tick = () => new Promise(r => setTimeout(r, 30));
const fmtDate = iso => { try { return new Date(iso).toLocaleString('ar-EG-u-nu-latn', {dateStyle: 'medium', timeStyle: 'short'}); } catch { return iso; } };

function norm(s) {
  return String(s ?? '')
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}
const compact = s => s.replace(/[^\p{L}\p{N}]+/gu, '');

function toast(msg, kind = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = ic(kind === 'err' ? 'alert' : 'check') + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, kind === 'err' ? 5200 : 2200);
}
function busy(text) {
  const b = document.createElement('div');
  b.className = 'busy';
  b.innerHTML = `<div><span class="spin"></span><b>${esc(text)}</b></div>`;
  document.body.appendChild(b);
  return { set: t => $('b', b).textContent = t, close: () => b.remove() };
}
function openModal({title, html, actions = [], wide = false}) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="mbox ${wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="mh"><h3>${esc(title)}</h3><button class="cp" data-x aria-label="إغلاق">${ic('x')}</button></div><div class="mb">${html}</div><div class="mf"></div></div>`;
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const mf = $('.mf', m);
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.kind || '');
    b.innerHTML = (a.icon ? ic(a.icon) : '') + esc(a.label);
    b.onclick = async () => { if (a.onClick) { const r = await a.onClick(m); if (r === false) return; } close(); };
    mf.appendChild(b);
  });
  if (!actions.length) mf.remove();
  $('[data-x]', m).onclick = close;
  m.addEventListener('mousedown', e => { if (e.target === m) close(); });
  document.body.appendChild(m);
  return { el: m, close };
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove();
  }

function parseWorkbook(buf) {
  const wb = XLSX.read(buf, {type: 'array', cellDates: true});
  let best = null;
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null, blankrows: false});
    if (!best || aoa.length > best.aoa.length) best = {name, aoa};
  }
  if (!best || best.aoa.length < 2) throw new Error('الملف لا يحتوي على صفوف بيانات.');
  const aoa = best.aoa;
  let h = aoa.findIndex((r, i) => i < 15 && r.filter(v => !isEmpty(v)).length >= 2);
  if (h < 0) h = 0;
  const head = aoa[h], data = aoa.slice(h + 1);
  const W = Math.max(head.length, ...data.map(r => r.length));
  const headers = [], seen = new Map(), notes = [];
  for (let i = 0; i < W; i++) {
    let n = isEmpty(head[i]) ? '' : String(head[i]).trim();
    if (!n) { n = 'عمود ' + (i + 1); notes.push(`العمود رقم ${i + 1} بلا عنوان.`); }
    if (seen.has(n)) { const k = seen.get(n) + 1; seen.set(n, k); n = `${n} (${k})`; } else seen.set(n, 1);
    headers.push(n);
  }
  return {sheet: best.name, headers, data, notes};
}

function validate(headers, data, map) {

  const st = {read: data.length, blank: 0, exactDup: 0, noCode: 0, noName: 0, noLoc: 0, badNum: 0, negQty: 0, dupCodes: [], warnings: []};
  const cC = map.code, cN = map.name, cL = map.loc, cQ = map.qty;
  for (const r of data) {
    const row = new Array(W);
    let any = false;
    for (let i = 0; i < W; i++) { const v = r[i] === undefined ? null : r[i]; row[i] = v; if (!isEmpty(v)) any = true; }
    if (!any) { st.blank++; continue; }
    const key = JSON.stringify(row);
    if (seen.has(key)) { st.exactDup++; continue; }
    seen.add(key);
    if (cC >= 0 && isEmpty(row[cC])) st.noCode++;
    if (cN >= 0 && isEmpty(row[cN])) st.noName++;
    if (cL >= 0 && isEmpty(row[cL])) st.noLoc++;
    if (cQ >= 0 && !isEmpty(row[cQ])) { if (typeof row[cQ] !== 'number' && !Number.isFinite(parseFloat(row[cQ]))) st.badNum++; else if (num(row[cQ]) < 0) st.negQty++; }

function mergeRows(oldH, oldRows, newH, newRows, mapNew) {

  const align = (rows, from) => { const ix = H.map(h => from.indexOf(h)); return rows.map(r => ix.map(i => i >= 0 ? r[i] : null)); };
  const oldA = align(oldRows, oldH), newA = align(newRows, newH);
  const cCode = H.indexOf(newH[mapNew.code]), cLoc = mapNew.loc >= 0 ? H.indexOf(newH[mapNew.loc]) : -1;
  const pos = new Map();
  oldA.forEach((r, i) => { const k = show(r[cCode]); if (k && !pos.has(k)) pos.set(k, i); });
  let added = 0, updated = 0, keptLoc = 0;
  for (const r of newA) {
    const k = show(r[cCode]);
    if (k && pos.has(k)) {
      const i = pos.get(k), old = oldA[i];
      if (cLoc >= 0 && isEmpty(r[cLoc]) && !isEmpty(old[cLoc])) { r[cLoc] = old[cLoc]; keptLoc++; }
      H.forEach((h, j) => { if (!newH.includes(h)) r[j] = old[j]; });
      oldA[i] = r; updated++;
    } else { oldA.push(r); if (k) pos.set(k, oldA.length - 1); added++; }
  }
  return {headers: H, rows: oldA, added, updated, keptLoc};
}

function diffAgainstCurrent(newH, newRows, map) {

  const seen = new Set(); let fresh = 0, same = 0, changed = 0;
  for (const r of newRows) {
    const k = show(r[map.code]); if (!k) continue; seen.add(k);
    const o = oldMap.get(k);
    if (!o) fresh++;
    else {
      const sameRow = newH.every((h, i) => { const oi = S.headers.indexOf(h); return oi >= 0 && JSON.stringify(o[oi] ?? null) === JSON.stringify(r[i] ?? null); }) && true;

async function handleFile(file) {
  if (!file) return;
  if (!/\.(xlsx|xls|xlsm|csv)$/i.test(file.name)) { toast('الملف غير مدعوم.', 'err'); return; }
  const b = busy('جاري قراءة الملف…');
  let parsed;
  try {
    await ensureXLSX();
    const buf = await file.arrayBuffer();
    await tick();
    parsed = parseWorkbook(buf);
  } catch (e) { b.close(); toast(e.message || 'تعذّرت قراءة الملف', 'err'); return; }
  b.close();

  let map = mapFromNames(parsed.headers, S.meta && S.meta.mapNames);
  const missing = ROLES.filter(r => r.req && map[r.k] < 0);
  if (missing.length) {
    const ok = await askMapping(parsed.headers, map, missing);
    if (!ok) return;
    map = ok;
  }
  const b2 = busy('جاري فحص البيانات…');
  await tick();
  let val, diff;
  try { val = validate(parsed.headers, parsed.data, map); diff = diffAgainstCurrent(parsed.headers, val.rows, map); }
  catch (e) { b2.close(); toast('فشل الفحص: ' + e.message, 'err'); return; }
  b2.close();
  if (!val.rows.length) { toast('لم يتم العثور على صنف صالح.', 'err'); return; }
  showImportPreview(file, parsed, map, val, diff);
}

function askMapping(headers, map, missing) {
  return new Promise(resolve => {
    const opts = sel => `<option value="-1">— لا يوجد —</option>` + headers.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h)}</option>`).join('');
    const reqKeys = new Set(missing.map(r => r.k));
    const html = `<p class="muted">اختر الأعمدة المطلوبة:</p>` +
      ROLES.filter(r => ['code', 'name', 'loc', 'qty', 'pn1', 'brand', 'car', 'model'].includes(r.k) || reqKeys.has(r.k)).map(r =>
        `<div class="maprow ${reqKeys.has(r.k) ? 'miss' : ''}"><label>${esc(r.label)}</label><select data-r="${r.k}">${opts(map[r.k])}</select></div>`).join('');
    const m = openModal({title: 'تحديد الأعمدة', html, wide: false, actions: [
      {label: 'متابعة', kind: 'primary', onClick: el => {
        const nm = {...map};
        $$('select', el).forEach(s => nm[s.dataset.r] = +s.value);
        if (nm.code < 0) { toast('اختيار عمود الكود مطلوب.', 'err'); return false; }
        resolve(nm);
      }},
      {label: 'إلغاء', onClick: () => resolve(null)}
    ]});
    m.el.querySelector('[data-x]').addEventListener('click', () => resolve(null));
  });
}

function showImportPreview(file, parsed, map, val, diff) {
  const {headers} = parsed, {rows, st} = val;
  const hasOld = S.rows.length > 0;
  const html = `
    <div class="muted">${esc(file.name)}</div>
    <div class="stats">
      <div class="stat good"><b>${fmt(rows.length)}</b><small>جاهز للاستيراد</small></div>
      ${diff ? `<div class="stat"><b>${fmt(diff.fresh)}</b><small>جديد</small></div><div class="stat warnx"><b>${fmt(diff.changed)}</b><small>مُتغيّر</small></div>` : ''}
    </div>`;
  const actions = [{label: hasOld ? 'استبدال كامل' : 'استيراد', kind: 'primary', icon: 'upload', onClick: () => applyImport('replace', file, parsed, map, val)}];
  if (hasOld) actions.push({label: 'دمج وتحديث', icon: 'layers', onClick: () => applyImport('merge', file, parsed, map, val)});
  actions.push({label: 'إلغاء'});
  openModal({title: 'مراجعة الاستيراد', html, actions, wide: true});
}

async function applyImport(mode, file, parsed, map, val) {
  const b = busy('جاري الحفظ على سحابية Firebase...');
  await tick();
  try {
    let headers = parsed.headers, rows = val.rows;
    let newMap = map;
    if (mode === 'merge' && S.rows.length) {
      const mg = mergeRows(S.headers, S.rows, parsed.headers, val.rows, map);
      headers = mg.headers; rows = mg.rows;
      newMap = mapFromNames(headers, namesFromMap(parsed.headers, map));
    }
    const meta = {headers, mapNames: namesFromMap(headers, newMap), importedAt: new Date().toISOString(), fileName: file.name, sheetName: parsed.sheet, count: rows.length, mode, columnCount: headers.length};
    const metaPuts = {main: meta};
    let backup = null;
    if (S.rows.length) {
      backup = {headers: S.headers, rows: S.rows, meta: S.meta, savedAt: new Date().toISOString()};
      metaPuts.backupInfo = {savedAt: backup.savedAt, count: S.rows.length, fileName: S.meta && S.meta.fileName};
    }
    if (DB.ok) await DB.commit({rows, metaPuts, backup});
    S.backupInfo = metaPuts.backupInfo || S.backupInfo;
    setData(headers, rows, meta);
    b.close();
    toast(`تم الحفظ بنجاح`);
    location.hash = '#/search';
    route();
  } catch (e) {
    b.close();
    toast('فشل الحفظ: ' + (e.message || ''), 'err');
  }
}

async function restoreBackup() {
  if (!DB.ok) return;
  const b = busy('جاري الاستعادة…');
  try {
    const bk = await DB.get('backup', 'prev');
    if (!bk) throw new Error('لا توجد نسخة');
    const cur = {headers: S.headers, rows: S.rows, meta: S.meta, savedAt: new Date().toISOString()};
    const info = {savedAt: cur.savedAt, count: S.rows.length, fileName: S.meta && S.meta.fileName};
    await DB.commit({rows: bk.rows, metaPuts: {main: bk.meta, backupInfo: info}, backup: cur});
    S.backupInfo = info;
    setData(bk.headers, bk.rows, bk.meta);
    b.close(); toast('تمت الاستعادة.'); route();
  } catch (e) { b.close(); toast('خطأ: ' + e.message, 'err'); }
}

async function exportXlsx(headers, rows, name) {
  try { await ensureXLSX(); } catch (e) { toast(e.message, 'err'); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows], {cellDates: true});
  const wb = XLSX.utils.book_new();
  wb.Workbook = {Views: [{RTL: true}]};
  XLSX.utils.book_append_sheet(wb, ws, 'الأصناف');
  XLSX.writeFile(wb, name + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
  toast('تم التصدير');
}

function setData(headers, rows, meta) {
  S.headers = headers; S.rows = rows; S.meta = meta;
  S.map = mapFromNames(headers, meta && meta.mapNames);
  buildIndex();
  reconcileSettings();
  T.page = 1; T.filters = {}; T.q = ''; T.dirty = true;
  renderChrome();
}
function reconcileSettings() {
  const st = S.settings, H = S.headers;
  const known = new Set(st.order || []);
  const order = (st.order || []).filter(h => H.includes(h));
  const fresh = H.filter(h => !known.has(h));
  const defRoles = ['code', 'name', 'pn1', 'pn2', 'pn3', 'pn4', 'title', 'brand', 'car', 'model', 'loc', 'qty', 'price'];
  const defIdx = new Set(defRoles.filter(k => col(k) >= 0).filter(k => !/^pn[234]$/.test(k) || S.rows.some(r => !isEmpty(r[col(k)]))).map(k => col(k)));
  const hidden = new Set((st.hidden || []).filter(h => H.includes(h)));
  fresh.forEach(h => { if (!defIdx.has(H.indexOf(h))) hidden.add(h); });
  if (!order.length) {
    const first = defRoles.map(k => col(k)).filter(i => i >= 0).map(i => H[i]);
    order.push(...first, ...H.filter(h => !first.includes(h)));
  } else order.push(...fresh);
  st.order = order; st.hidden = [...hidden];
}
let saveT;
function saveSettings() { clearTimeout(saveT); saveT = setTimeout(() => { if (DB.ok) DB.put('meta', 'settings', S.settings).catch(() => {}); }, 300); }

const TITLES = {search: 'البحث السريع', bulk: 'البحث المتعدد', table: 'كل الأصناف', dashboard: 'لوحة التحكم', data: 'البيانات'};
function route() {
  const v = (location.hash.match(/#\/(\w+)/) || [])[1];
  const view = TITLES[v] ? v : 'search';
  $$('.view').forEach(e => e.classList.toggle('on', e.id === 'v-' + view));
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  $('#ptitle').textContent = TITLES[view];
  document.title = TITLES[view] + ' | Auto Parts Smart Finder';
  if (view === 'search') renderSearch();
  if (view === 'bulk') renderBulk();
  if (view === 'table') renderTable();
  if (view === 'dashboard') renderDashboard();
  if (view === 'data') renderData();
  window.scrollTo(0, 0);
}
function renderChrome() {

}

const Q = {q: '', scope: 'all', shown: 30, ids: [], res: null, prevHad: false, raf: 0};
function renderSearch() {
  const has = S.rows.length > 0;
  $('.hero').style.display = has ? '' : 'none';
  if (!has) { $('#results').innerHTML = ''; $('#rmeta').innerHTML = ''; $('#more').innerHTML = ''; $('#sbanner').innerHTML = ''; $('#sempty').innerHTML = emptyState(); return; }
  $('#scopeChips').innerHTML = Object.keys(SCOPES).filter(k => k !== 'loc' || col('loc') >= 0).map(k => `<button class="chip ${Q.scope === k ? 'on' : ''}" data-scope="${k}">${SCOPE_LABEL[k]}</button>`).join('');
  doSearch(true);
  if (matchMedia('(hover:hover)').matches) $('#q').focus();
}
function doSearch(force) {
  const q = $('#q').value;
  $('#qclear').hidden = !q;
  if (!force && q === Q.q && Q.res) return;
  Q.q = q; Q.shown = 30;
  $('#sempty').innerHTML = '';
  const res = runSearch(q, Q.scope);
  Q.res = res;
  if (!res.ids) { Q.ids = []; $('#results').innerHTML = ''; $('#more').innerHTML = ''; $('#sbanner').innerHTML = ''; $('#rmeta').innerHTML = `<span>${fmt(S.rows.length)} صنف في القاعدة</span>`; Q.prevHad = false; return; }
  Q.ids = res.ids;
  setHL(q);
  renderResults(true);
}
function renderResults(reset) {
  const ids = Q.ids, box = $('#results');
  const slice = ids.slice(0, Q.shown);
  box.classList.toggle('noanim', Q.prevHad && reset);
  box.innerHTML = slice.map((i, k) => cardHTML(i, k)).join('');
  Q.prevHad = ids.length > 0;
  $('#rmeta').innerHTML = ids.length ? `<span><b class="mono">${fmt(ids.length)}</b> نتيجة</span>` : '';
  $('#more').innerHTML = ids.length > Q.shown ? `<button class="btn" data-more>عرض المزيد (${fmt(ids.length - Q.shown)})</button>` : '';
  $('#sempty').innerHTML = ids.length ? '' : `<div class="empty"><div class="big">${ic('search')}</div><h3>لا توجد نتائج لـ «${esc(Q.q.trim())}»</h3></div>`;
}
function pnList(i) {
  return ['pn1', 'pn2', 'pn3', 'pn4'].map((k, j) => ({n: j + 1, v: show(cell(i, k))})).filter(p => p.v);
}
function cardHTML(i, k) {
  const code = show(cell(i, 'code')), name = show(cell(i, 'name')), title = show(cell(i, 'title')), loc = show(cell(i, 'loc'));
  const brand = show(cell(i, 'brand')), car = show(cell(i, 'car')), model = show(cell(i, 'model')), unit = show(cell(i, 'unit'));
  const qv = cell(i, 'qty'), st = stockState(i), price = S.idx.price[i];
  const cp = (t, tip = 'نسخ') => `<button class="cp" data-copy="${esc(t)}" title="${tip}" aria-label="${tip}">${ic('copy')}</button>`;
  const pns = pnList(i);
  const stLabel = st === 'zero' ? 'نفد' : st === 'low' ? 'منخفض' : 'متوفر';
  return `<article class="card" data-i="${i}" style="--d:${Math.min(k, 10)}">
    <div class="c-top"><span class="codepill"><span class="ltr">${hl(code) || '—'}</span>${code ? cp(code, 'نسخ الكود') : ''}</span><span class="qty ${st === 'zero' ? 'zero' : st === 'low' ? 'low' : ''}"><i></i>${stLabel}</span></div>
    <div class="c-name" dir="auto">${hl(name) || '<span class="nul">بدون اسم</span>'}</div>
    ${title && title !== name ? `<span class="c-title" dir="auto">${hl(title)}</span>` : ''}
    <div class="pns">${pns.length ? pns.map(p => `<span class="pn"><small>PN${p.n}</small><span class="mono ltr">${hl(p.v)}</span>${cp(p.v)}</span>`).join('') : '<span class="nopn">لا يوجد Part Number</span>'}</div>
    ${col('loc') >= 0 ? `<div class="loc ${loc ? '' : 'none'}"><span class="pin">${ic('pin')}</span><div><small>الموقع</small><div class="lv">${loc ? `<span class="ltr">${hl(loc)}</span>` : 'غير محدد'}</div></div>${loc ? cp(loc) : ''}</div>` : ''}
    <div class="meta3"><div><small>الماركة</small><span dir="auto">${hl(brand) || '—'}</span></div><div><small>السيارة</small><span dir="auto">${hl(car) || '—'}</span></div><div><small>الموديل</small><span dir="auto">${hl(model) || '—'}</span></div></div>
    <div class="c-foot"><div><small class="muted">الكمية</small><div class="qbig">${isEmpty(qv) ? '—' : esc(show(qv))}<small>${esc(unit)}</small></div></div>
      ${col('price') >= 0 ? `<span class="price" data-price title="إظهار السعر"><small>السعر</small><span class="pv">${fmt(price)}</span></span>` : ''}</div>
  </article>`;
}

const B = {raw: '', rows: []};
function lookupBulkQuery(rawLine) {
  const nq = norm(rawLine), full = compact(nq);
  if (!full && !nq) return [];
  const I = S.idx;
  if (full && I.codeMap.has(full)) return I.codeMap.get(full);
  if (full && I.pnMap.has(full)) return I.pnMap.get(full);
  const hits = [];
  for (let i = 0; i < S.rows.length; i++) {
    if (full && (I.c.code[i].includes(full) || I.c.pn1[i].includes(full))) hits.push(i);
  }
  return hits;
}

function renderBulk() {
  const v = $('#v-bulk');
  if (!S.rows.length) { v.innerHTML = emptyState(); return; }
  v.innerHTML = `
    <div class="bulk-grid">
      <div class="bulk-box">
        <h3>${ic('bulk')}<span>قائمة الأكواد</span></h3>
        <textarea id="bulkInput" spellcheck="false" placeholder="اكتب كل كود في سطر...">${esc(B.raw)}</textarea>
        <div class="bulk-acts"><button class="btn primary" id="bulkRun">بحث</button><button class="btn" id="bulkClear">مسح</button></div>
      </div>
      <div id="bulkOut"></div>
    </div>`;
  const ta = $('#bulkInput');
  ta.addEventListener('input', () => { B.raw = ta.value; computeBulk(); });
  $('#bulkRun').onclick = () => { B.raw = ta.value; computeBulk(); };
  $('#bulkClear').onclick = () => { B.raw = ''; ta.value = ''; computeBulk(); };
  computeBulk();
}

function computeBulk() {
  const out = $('#bulkOut');
  if (!out) return;
  const lines = B.raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!lines.length) {
    out.innerHTML = `<div class="empty"><div class="big">${ic('bulk')}</div><h3>قائمة البحث فارغة</h3></div>`;
    return;
  }
  const results = lines.map((query, qIdx) => {
    const matched = lookupBulkQuery(query);
    return matched.length ? {qIdx: qIdx + 1, query, idx: matched[0], found: true} : {qIdx: qIdx + 1, query, found: false};
  });
  out.innerHTML = `<div class="twrap"><table><thead><tr><th>#</th><th>الكود</th><th>النتيجة</th></tr></thead><tbody>
    ${results.map(r => r.found ? `<tr><td>${r.qIdx}</td><td class="ltr">${r.query}</td><td>${show(cell(r.idx, 'name'))} (${show(cell(r.idx, 'loc'))})</td></tr>` : `<tr class="bulk-miss"><td>${r.qIdx}</td><td class="ltr">${r.query}</td><td style="color:var(--danger)">غير موجود</td></tr>`).join('')}
  </tbody></table></div>`;
}

function openDetails(i) {
  const row = S.rows[i], code = show(cell(i, 'code')), name = show(cell(i, 'name')), loc = show(cell(i, 'loc'));
  const cp = t => t ? `<button class="cp" data-copy="${esc(t)}" aria-label="نسخ">${ic('copy')}</button>` : '';
  const kv = (label, v) => `<div class="row"><span>${esc(label)}</span><span>${show(v) ? `<span>${esc(show(v))}</span>${cp(show(v))}` : '—'}</span></div>`;
  const html = `
    <div class="dh"><div><div class="mono ltr" style="color:var(--amber)">${esc(code)}</div><h3 dir="auto">${esc(name)}</h3></div><button class="cp" data-close>${ic('x')}</button></div>
    <div class="db">${kv('الكود', code)}${kv('الاسم', name)}${kv('الموقع', loc)}${S.headers.map((h, ci) => kv(h, row[ci])).join('')}</div>`;
  $('#drawer').innerHTML = html;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
}
function closeDrawer() { $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }

const T = {q: '', filters: {}, page: 1, view: [], dirty: true, built: false, combos: {}};
class Combo {
  constructor(el, label, onChange) {
    this.el = el; this.label = label; this.onChange = onChange; this.opts = []; this.val = '';
    el.innerHTML = `<button class="combo-btn"><span><small>${esc(label)}</small><span class="cv">الكل</span></span>${ic('chev')}</button><div class="popbox"><div class="ps"><input placeholder="بحث…" dir="auto"></div><ul></ul></div>`;
    this.btn = $('.combo-btn', el); this.inp = $('input', el); this.ul = $('ul', el);
    this.btn.onclick = e => { e.stopPropagation(); const o = !el.classList.contains('open'); closePops(); el.classList.toggle('open', o); };
  }
  setOptions(o) { this.opts = o; }
  set(v) { this.val = v; }
}
function closePops() { $$('.pop.open').forEach(p => p.classList.remove('open')); }

function renderTable() {
  const has = S.rows.length > 0;
  $('#tbar').style.display = has ? '' : 'none'; $('.twrap').style.display = has ? '' : 'none';

function renderDashboard() {
  const v = $('#v-dashboard');
  if (!S.rows.length) { v.innerHTML = emptyState(); return; }

function renderData() {
  const v = $('#v-data'), has = S.rows.length > 0, m = S.meta;
  v.innerHTML = `
    <div class="drop" id="drop" tabindex="0">
      <div class="big">${ic('upload')}</div>
      <h3>اسحب ملف Excel وأفلته هنا، أو اضغط للاختيار</h3>

  if (has) {

    $('#wipe').onclick = async () => { await DB.wipe(); setData([], [], null); route(); };

document.addEventListener('click', async e => {
  const t = e.target;
  const cp = t.closest('[data-copy]');
  if (cp) { await copyText(cp.dataset.copy); toast('تم النسخ'); return; }
  if (t.closest('[data-pick]') || t.closest('#topImport')) { $('#file').click(); return; }
  if (t.closest('[data-close]') || t.id === 'scrim') { closeDrawer(); return; }
  const card = t.closest('.card'); if (card) { openDetails(+card.dataset.i); return; }
});
$('#q').addEventListener('input', () => doSearch());
$('#file').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
window.addEventListener('hashchange', route);

(async function init() {
  try {
    await DB.open();
    const [meta, rows, st, bi] = await Promise.all([DB.get('meta', 'main'), DB.getAll('records'), DB.get('meta', 'settings'), DB.get('meta', 'backupInfo')]);
    if (st) S.settings = Object.assign(S.settings, st);
    S.backupInfo = bi || null;
    if (meta && rows.length) setData(meta.headers, rows, meta);
  } catch (e) {
    console.warn('DB error', e);
  }
  if (!S.rows.length) {
    await tryAutoLoadBundledExcel(true);
  }
  renderChrome();
  ensureXLSX().catch(() => {});
  route();
})();
})();
